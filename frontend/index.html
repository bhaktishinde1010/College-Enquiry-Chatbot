<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanjivani College Enquiry Chatbot</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">🎓</div>
        <div>
          <h1>Sanjivani</h1>
          <p>College Enquiry Bot</p>
        </div>
      </div>
      <div class="quick-actions">
        <p class="qa-title">Quick Questions</p>
        <button class="qa-btn" data-q="What courses do you offer?">📚 Courses</button>
        <button class="qa-btn" data-q="What is the admission process?">🎯 Admissions</button>
        <button class="qa-btn" data-q="What are the fees?">💰 Fees</button>
        <button class="qa-btn" data-q="Tell me about placements">💼 Placements</button>
        <button class="qa-btn" data-q="What scholarships are available?">🏆 Scholarships</button>
        <button class="qa-btn" data-q="Contact details">📞 Contact</button>
      </div>
      <button id="clearBtn" class="clear-btn">🗑️ Clear Chat</button>
    </aside>

    <main class="chat-container">
      <header class="chat-header">
        <div class="avatar">🤖</div>
        <div>
          <h2>Enquiry Assistant</h2>
          <p><span class="status-dot"></span> Online • Replies instantly</p>
        </div>
      </header>

      <div id="chatBox" class="chat-box">
        <div class="message bot">
          <div class="bubble">
            Hello! 👋 I'm the Sanjivani College Enquiry Assistant.<br>
            Ask me about <b>admissions, courses, fees, placements, scholarships, hostel, events</b> and more!
          </div>
        </div>
      </div>

      <form id="chatForm" class="chat-form">
        <input id="userInput" type="text" placeholder="Type your question..." autocomplete="off" required>
        <button type="submit" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </form>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
